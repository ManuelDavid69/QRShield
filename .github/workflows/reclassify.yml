name: Reclassement des liens

# Remplace le conteneur worker en production : l'offre gratuite de Render n'en propose pas
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  reclassify:
    # Ne tourne qu'une fois la base en ligne configurée dans les variables du dépôt
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      COMMUNITY_SECRET: ${{ secrets.COMMUNITY_SECRET }}
      GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m app.worker --once
